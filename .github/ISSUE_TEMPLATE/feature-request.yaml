name: 需求建议
description: 新功能、体验改进等建议
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 前置确认
      options:
        - label: 我基本确定这是一个新需求而不是 Bug（不确定的话请附上日志，改用 Bug 反馈模板）
          required: true
        - label: 我确认此需求在活跃与已关闭 Issue 中均未被提及
          required: true
  - type: textarea
    id: describe
    attributes:
      label: 你遇到了什么问题？
      description: 这个需求想解决的实际场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案是什么？
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 其他内容
      description: 相关背景、参考实现或截图
    validations:
      required: false
